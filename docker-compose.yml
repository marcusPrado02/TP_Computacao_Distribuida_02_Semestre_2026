# 4 nós simétricos na mesma rede Docker. Os nomes de serviço viram hostnames.
# Demo de falha do líder:  docker compose stop node4
# Antes de subir: cp .env.example .env  e troque CLUSTER_TOKEN.
x-node: &node
  build: .
  image: aco-node:latest
  restart: "no"

x-env: &env
  NODE_PORT: "50051"
  CLUSTER_TOKEN: "${CLUSTER_TOKEN:?defina CLUSTER_TOKEN no arquivo .env}"
  TSP_CITIES: "60"
  TSP_SEED: "42"
  ROUNDS: "30"
  ANTS: "40"
  # Lotes de formigas por rodada: só alonga a parte local. Demo do failover: ~1000 com berlin52
  # deixa a rodada em ~1 s (medido com 4 nós numa máquina de 16 núcleos; meça a sua, PENDENCIAS 2.1).
  ITERATIONS_PER_ROUND: "${ITERATIONS_PER_ROUND:-1}"
  # Instância TSPLIB embutida na imagem (COPY data). Vazio = aleatória com TSP_CITIES/TSP_SEED.
  TSP_FILE: "${TSP_FILE:-}"
  START_DELAY_MS: "5000"
  # Barreira: o líder só começa a rodada 1 quando todos os peers responderem.
  PEER_WAIT_MS: "30000"

services:
  node1:
    <<: *node
    environment:
      <<: *env
      NODE_ID: "1"
      PEERS: "2=node2:50051,3=node3:50051,4=node4:50051"

  node2:
    <<: *node
    environment:
      <<: *env
      NODE_ID: "2"
      PEERS: "1=node1:50051,3=node3:50051,4=node4:50051"

  node3:
    <<: *node
    environment:
      <<: *env
      NODE_ID: "3"
      PEERS: "1=node1:50051,2=node2:50051,4=node4:50051"

  node4:
    <<: *node
    environment:
      <<: *env
      NODE_ID: "4"
      PEERS: "1=node1:50051,2=node2:50051,3=node3:50051"
