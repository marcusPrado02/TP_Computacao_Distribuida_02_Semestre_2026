syntax = "proto3";

package aco;

option java_multiple_files = true;
option java_package = "br.pucminas.cd.aco.grpc";
option java_outer_classname = "NodeProto";

// Serviço único exposto por todos os nós (os nós são simétricos:
// qualquer um pode ser eleito líder).
//
// Todas as chamadas são unárias, com deadline no cliente e autenticadas pelo
// header "x-cluster-token". Toda resposta também carrega Header, para o
// cliente aplicar a regra de recebimento do relógio de Lamport.
service NodeService {
  // --- Eleição de líder (Bully) ---
  // Candidato -> nós de id maior, ao iniciar uma eleição. ok=true: "estou vivo, deixa comigo".
  rpc Election(ElectionMsg) returns (ElectionReply);
  // Novo líder -> todos, ao vencer a eleição.
  rpc Coordinator(CoordinatorMsg) returns (Ack);
  // Seguidor -> líder, a cada 1 s (detector de falha). Só o Ack importa.
  rpc Heartbeat(HeartbeatMsg) returns (Ack);

  // --- Exclusão mútua (Ricart-Agrawala) ---
  // Nó que quer a seção crítica -> todos os vivos. O Ack só confirma a entrega, não é permissão.
  rpc RequestCS(CsRequest) returns (Ack);
  // Nó -> solicitante: a permissão, enviada na hora ou adiada até sair da seção crítica.
  rpc ReplyCS(CsReply) returns (Ack);

  // --- Rodadas do ACO ---
  // Líder -> todos, no início de cada rodada.
  rpc StartRound(RoundStart) returns (Ack);
  // Cada nó -> líder, depois de atualizar o feromônio na seção crítica.
  rpc RoundDone(RoundResult) returns (Ack);
  // Dono da seção crítica -> todos, antes de liberá-la: nova matriz completa.
  rpc UpdatePheromone(PheromoneUpdate) returns (Ack);
}

// Presente em toda mensagem: quem enviou e o relógio de Lamport no envio.
message Header {
  int32 sender_id = 1;
  int64 lamport = 2;
}

// Resposta genérica: confirma a entrega e devolve o relógio do receptor.
message Ack {
  Header header = 1;
}

message ElectionMsg {
  Header header = 1;
}

// ok = true significa "tenho id maior e estou vivo; deixa comigo".
message ElectionReply {
  Header header = 1;
  bool ok = 2;
}

message CoordinatorMsg {
  Header header = 1;
  int32 leader_id = 2;
}

message HeartbeatMsg {
  Header header = 1;
}

// request_ts é o timestamp de Lamport do pedido (fixo durante toda a espera),
// diferente de header.lamport, que muda a cada envio.
message CsRequest {
  Header header = 1;
  int64 request_ts = 2;
}

// request_ts identifica qual pedido está sendo autorizado. Sem ele, um REPLY
// atrasado de um pedido antigo poderia ser contado como permissão do pedido atual.
message CsReply {
  Header header = 1;
  int64 request_ts = 2;
}

// round começa em 1 e cresce de 1 em 1; um novo líder continua da última vista.
message RoundStart {
  Header header = 1;
  int32 round = 2;
}

// Melhor rota encontrada pelas formigas do nó nesta rodada.
message RoundResult {
  Header header = 1;
  int32 round = 2;
  repeated int32 tour = 3;
  double length = 4;
}

// Matriz de feromônio completa (n*n, row-major) após a atualização feita
// dentro da seção crítica, mais a melhor rota global conhecida pelo remetente.
message PheromoneUpdate {
  Header header = 1;
  int32 round = 2;
  repeated double tau = 3;
  repeated int32 best_tour = 4;
  double best_length = 5;
}
